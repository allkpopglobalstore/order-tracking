<!DOCTYPE html>
<html>

<head>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

.container {
  width: 96%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
}


/* =========================
   SEARCH
========================= */

.top {
  width: 100%;
  max-width: 700px;
  margin: 0 auto 10px auto;

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.field-group {
  min-width: 0;
}

.search-label {
  display: block;
  margin: 0 0 6px 2px;
  font-size: 12px;
  font-weight: 600;
  color: #555;
}

.top input,
.top select {
  width: 100%;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 9px;
  background: white;
  font-size: 15px;
  outline: none;
}

.top input:focus,
.top select:focus {
  border-color: #777;
}

.top button {
  grid-column: 1 / -1;
  width: 100%;
  padding: 14px 16px;
  background: black;
  color: white;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
}


/* =========================
   INFO + LIKE
========================= */

.info-bar {
  width: 100%;
  max-width: 700px;
  margin: 0 auto 18px auto;
  padding: 9px 12px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  background: white;
  border: 1px solid #e6e6e6;
  border-radius: 8px;
}

.info-message {
  color: #666;
  font-size: 11px;
  line-height: 1.35;
  flex: 1;
}

.info-icon {
  margin-right: 4px;
}

.like-area {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  flex-shrink: 0;
}

.like-button {
  width: 30px;
  height: 30px;
  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid #ddd;
  border-radius: 50%;
  background: white;
  color: #555;
  cursor: pointer;
  font-size: 16px;
}

.like-button.liked {
  background: #fff0f3;
  border-color: #ffc5d0;
  color: #e63961;
}

.like-button.busy {
  opacity: 0.6;
  pointer-events: none;
}

.like-count {
  color: #777;
  font-size: 10px;
  white-space: nowrap;
}


/* =========================
   SUMMARY
========================= */

.result-summary {
  max-width: 700px;
  margin: 0 auto 16px auto;
  font-size: 12px;
  color: #666;
  text-align: center;
}


/* =========================
   MESSAGES
========================= */

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.loading {
  text-align: center;
  padding: 20px;
  color: #666;
}

.error {
  background: #ffe6e6;
  color: #b30000;
  padding: 12px;
  border-radius: 8px;
}


/* =========================
   STATUS
========================= */

.status {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 5px 10px;
  border-radius: 20px;

  color: white;
  font-size: 12px;
  white-space: nowrap;
}


/* =========================
   DESKTOP
========================= */

.desktop-view {
  display: block;
}

.mobile-view {
  display: none;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  table-layout: auto;
}

th,
td {
  padding: 12px 10px;
  border-bottom: 1px solid #eee;
  text-align: left;
  font-size: 14px;
  vertical-align: middle;
}

th {
  background: #111;
  color: white;
  white-space: nowrap;
}


/* =========================
   GROUPED ORDER
========================= */

.order-group {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 16px;
}

.order-number {
  background: #111;
  color: white;
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 700;
}

.order-list-title {
  padding: 10px 14px;
  background: #f5f5f5;
  border-bottom: 1px solid #e8e8e8;
  font-size: 10px;
  font-weight: 700;
  color: #666;
  letter-spacing: 0.6px;
}

.order-item {
  border-bottom: 1px solid #e8e8e8;
}

.order-item:last-child {
  border-bottom: none;
}

.item-toggle {
  width: 100%;
  padding: 13px 14px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  background: white;
  border: none;

  color: #222;
  cursor: pointer;

  text-align: left;
  font-size: 12px;
  font-weight: 600;
}

.item-name {
  min-width: 0;
  overflow-wrap: anywhere;
}

.item-arrow {
  flex-shrink: 0;
  color: #777;
  font-size: 12px;
}

.item-details {
  display: none;
  border-top: 1px solid #eee;
}

.item-details.open {
  display: block;
}


/* =========================
   SINGLE ORDER CARD
========================= */

.single-order {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 16px;
}

.single-product {
  padding: 13px 14px;
  background: #111;
  color: white;
  font-size: 13px;
  font-weight: 700;
}

.single-item-count {
  padding: 9px 14px 4px 14px;
  font-size: 10px;
  color: #777;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.single-item-name {
  padding: 8px 14px 12px 14px;
  font-size: 12px;
  font-weight: 600;
  border-bottom: 1px solid #eee;
}

.single-main {
  border-bottom: 1px solid #eee;
}

.single-extra {
  display: none;
}

.single-extra.open {
  display: block;
}

.single-more {
  width: 100%;
  padding: 11px;
  background: #fafafa;
  border: none;
  border-top: 1px solid #eee;
  color: #333;
  font-size: 12px;
  cursor: pointer;
}


/* =========================
   DETAIL ROW
========================= */

.detail-row {
  display: grid;
  grid-template-columns: 40% 60%;
  border-bottom: 1px solid #eee;
}

.detail-row:last-child {
  border-bottom: none;
}

.detail-label {
  padding: 10px;
  background: #f7f7f7;
  color: #555;
  font-size: 10px;
  font-weight: 600;
}

.detail-value {
  padding: 10px;
  color: #222;
  font-size: 11px;
  min-width: 0;
  overflow-wrap: anywhere;
}

.detail-value .status {
  font-size: 9px;
  padding: 3px 6px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  body {
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 100%;
    padding: 12px;
  }

  .top {
    gap: 7px;
    margin-bottom: 9px;
  }

  .search-label {
    font-size: 10px;
  }

  .top input,
  .top select {
    padding: 11px 9px;
    font-size: 12px;
  }

  .top button {
    padding: 12px;
    font-size: 14px;
  }

  .info-bar {
    padding: 8px 9px;
    gap: 7px;
    margin-bottom: 14px;
  }

  .info-message {
    font-size: 9px;
  }

  .like-button {
    width: 28px;
    height: 28px;
    font-size: 15px;
  }

  .like-count {
    font-size: 9px;
  }

  .desktop-view {
    display: none;
  }

  .mobile-view {
    display: block;
  }

}

</style>

</head>


<body>

<div class="container">


  <div class="top">

    <div class="field-group">

      <label
        class="search-label"
        for="userid"
      >
        Instagram User ID
      </label>

      <input
        id="userid"
        type="text"
        placeholder="Instagram User ID"
        autocomplete="off"
      >

    </div>


    <div class="field-group">

      <label
        class="search-label"
        for="statusFilter"
      >
        Order Status
      </label>

      <select id="statusFilter">

        <option value="">
          All Status
        </option>

        <option value="TO BUY">
          To Buy
        </option>

        <option value="PURCHASED">
          Purchased
        </option>

        <option value="IN WAREHOUSE CH">
          In Warehouse CH
        </option>

        <option value="IN WAREHOUSE KR">
          In Warehouse KR
        </option>

        <option value="IN TRANSIT TO ES">
          In Transit to ES
        </option>

        <option value="IN SPAIN">
          In Spain
        </option>

        <option value="DELIVERED">
          Delivered
        </option>

      </select>

    </div>


    <button
      id="searchButton"
      type="button"
    >
      🔎 Search
    </button>

  </div>


  <div class="info-bar">

    <div class="info-message">

      <span class="info-icon">
        ⓘ
      </span>

      Delivered orders remain visible for 30 days.

    </div>


    <div class="like-area">

      <button
        id="likeButton"
        class="like-button"
        type="button"
      >
        ♡
      </button>

      <span
        id="likeCount"
        class="like-count"
      >
        Loading...
      </span>

    </div>

  </div>


  <div
    id="resultSummary"
    class="result-summary"
  ></div>


  <div id="results"></div>


</div>


<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbz80y4d-Ot7gRRKQBr0HZ_iO4stEpMIAMC6NjPy5dOiwXRzHkPkzKsmFq97cPWcf9i_/exec";


let allOrders = [];


/* =========================
   NORMALIZE
========================= */

function normalizeHeader(key) {

  return (key || "")
    .toString()
    .trim()
    .toLowerCase()
    .replace(
      /[👤📍📅🏢✈️📦🚩🗓️]/g,
      ""
    )
    .replace(/\s+/g, " ")
    .trim();

}


function normalizeStatus(value) {

  return (value || "")
    .toString()
    .replace(/\u00A0/g, " ")
    .replace(/\u200B/g, "")
    .replace(/\u200C/g, "")
    .replace(/\u200D/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .toUpperCase();

}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   COLUMN TYPES
========================= */

function isIdColumn(key) {
  return normalizeHeader(key) === "id";
}

function isUserIdColumn(key) {

  const k =
    normalizeHeader(key);

  return (
    k === "user id" ||
    k === "userid"
  );

}

function isOrderIdColumn(key) {

  const k =
    normalizeHeader(key);

  return (
    k === "order id" ||
    k === "orderid" ||
    k === "order_id"
  );

}

function isProductColumn(key) {

  const k =
    normalizeHeader(key);

  return (
    k === "producto" ||
    k === "product"
  );

}

function isPaymentColumn(key) {
  return normalizeHeader(key)
    .includes("payment");
}

function isShippingColumn(key) {
  return normalizeHeader(key)
    .includes("shipping");
}

function isStatusColumn(key) {
  return normalizeHeader(key)
    .includes("status");
}

function isMonthColumn(key) {

  const k =
    normalizeHeader(key);

  return (
    k === "mes" ||
    k === "month"
  );

}

function isPurchaseDateColumn(key) {
  return normalizeHeader(key)
    .includes("purchase");
}

function isWarehouseColumn(key) {

  const k =
    normalizeHeader(key);

  return (
    k.includes("warehouse") &&
    !k.includes("arrival")
  );

}

function isArrivalColumn(key) {
  return normalizeHeader(key)
    .includes("arrival");
}

function isDepartureColumn(key) {
  return normalizeHeader(key)
    .includes("departure");
}

function isDeliveredDateColumn(key) {
  return normalizeHeader(key)
    .includes("delivered date");
}


/* =========================
   ITEM DETECTION
========================= */

function getProductKey(row) {

  return Object
    .keys(row)
    .find(
      key =>
        isProductColumn(key)
    ) || null;

}


function getItemKey(row) {

  const keys =
    Object.keys(row);


  const known =
    keys.find(
      key => {

        const k =
          normalizeHeader(key);

        return (
          k === "item" ||
          k === "items" ||
          k.includes(
            "producto comprado"
          ) ||
          k.includes(
            "product name"
          ) ||
          k.includes(
            "description"
          ) ||
          k.includes(
            "item name"
          )
        );

      }
    );


  if (
    known !== undefined
  ) {

    return known;

  }


  const productKey =
    getProductKey(row);


  if (productKey) {

    const productIndex =
      keys.indexOf(
        productKey
      );


    if (
      productIndex !== -1 &&
      productIndex + 1 <
      keys.length
    ) {

      return keys[
        productIndex + 1
      ];

    }

  }


  return null;

}


function getItemValue(row) {

  const key =
    getItemKey(row);


  if (!key) {
    return "-";
  }


  const value =
    row[key];


  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return value;

}


/* =========================
   VALUE HELPERS
========================= */

function getValueByTest(
  row,
  testFunction
) {

  const key =
    Object
      .keys(row)
      .find(
        testFunction
      );


  if (!key) {
    return "-";
  }


  const value =
    row[key];


  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return value;

}


/* =========================
   STATUS
========================= */

function getOrderStatus(row) {

  return normalizeStatus(
    getValueByTest(
      row,
      isStatusColumn
    )
  );

}


function getStatusHTML(value) {

  const originalValue =
    value ?? "-";


  const v =
    normalizeStatus(
      originalValue
    );


  let color =
    "#999";


  if (v === "DELIVERED") {
    color = "#2ecc71";
  }

  else if (v === "PURCHASED") {
    color = "#f1c40f";
  }

  else if (v === "IN WAREHOUSE KR") {
    color = "#9b59b6";
  }

  else if (v === "IN SPAIN") {
    color = "#3498db";
  }

  else if (v === "TO BUY") {
    color = "#e74c3c";
  }

  else if (v === "IN WAREHOUSE CH") {
    color = "#e67e22";
  }

  else if (v === "IN TRANSIT TO ES") {
    color = "#ff69b4";
  }


  return `
    <span
      class="status"
      style="background:${color};"
    >
      ${escapeHTML(originalValue)}
    </span>
  `;

}


/* =========================
   LIKE
========================= */

function hasLiked() {

  try {

    return (
      localStorage
        .getItem(
          "allkpopOrderTrackingLiked"
        )
      === "yes"
    );

  }

  catch (error) {

    return false;

  }

}


function saveLikedState(liked) {

  try {

    if (liked) {

      localStorage
        .setItem(
          "allkpopOrderTrackingLiked",
          "yes"
        );

    }

    else {

      localStorage
        .removeItem(
          "allkpopOrderTrackingLiked"
        );

    }

  }

  catch (error) {

    console.error(error);

  }

}


function updateLikeUI() {

  const button =
    document
      .getElementById(
        "likeButton"
      );


  if (hasLiked()) {

    button.textContent =
      "♥";

    button.classList
      .add("liked");

  }

  else {

    button.textContent =
      "♡";

    button.classList
      .remove("liked");

  }

}


function updateLikeCount(likes) {

  const safeLikes =
    Math.max(
      0,
      Number(likes) || 0
    );


  document
    .getElementById(
      "likeCount"
    )
    .textContent =
    safeLikes +
    (
      safeLikes === 1
        ? " like"
        : " likes"
    );

}


async function loadLikes() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=getLikes"
      );


    const data =
      await response.json();


    updateLikeCount(
      data.likes
    );

  }

  catch (error) {

    console.error(error);

  }

}


async function toggleLike() {

  const button =
    document
      .getElementById(
        "likeButton"
      );


  if (
    button.classList
      .contains("busy")
  ) {
    return;
  }


  button.classList
    .add("busy");


  const currentlyLiked =
    hasLiked();


  const action =
    currentlyLiked
      ? "unlike"
      : "like";


  try {

    const response =
      await fetch(
        API_URL +
        "?action=" +
        action
      );


    const data =
      await response.json();


    saveLikedState(
      !currentlyLiked
    );


    updateLikeUI();


    updateLikeCount(
      data.likes
    );

  }

  catch (error) {

    console.error(error);

  }

  finally {

    button.classList
      .remove("busy");

  }

}


/* =========================
   SEARCH
========================= */

async function search() {

  const results =
    document
      .getElementById(
        "results"
      );


  const summary =
    document
      .getElementById(
        "resultSummary"
      );


  const userId =
    document
      .getElementById(
        "userid"
      )
      .value
      .trim();


  if (!userId) {

    results.innerHTML =
      "<div class='error'>Enter your Instagram User ID</div>";


    summary.innerHTML =
      "";


    return;

  }


  results.innerHTML =
    "<div class='loading'>Loading orders...</div>";


  summary.innerHTML =
    "";


  try {

    const response =
      await fetch(
        API_URL +
        "?userId=" +
        encodeURIComponent(
          userId
        )
      );


    const data =
      await response.json();


    if (
      !Array.isArray(data)
    ) {

      throw new Error(
        "API error"
      );

    }


    allOrders =
      data;


    applyStatusFilter();

  }

  catch (error) {

    console.error(error);


    results.innerHTML =
      "<div class='error'>Error loading data</div>";

  }

}


/* =========================
   FILTER
========================= */

function applyStatusFilter() {

  const selectedStatus =
    normalizeStatus(
      document
        .getElementById(
          "statusFilter"
        )
        .value
    );


  let filtered =
    [...allOrders];


  if (selectedStatus) {

    filtered =
      allOrders.filter(
        order =>
          getOrderStatus(order)
          === selectedStatus
      );

  }


  renderOrders(
    filtered
  );

}


/* =========================
   GROUP BY ORDER ID
========================= */

function groupOrders(data) {

  const groups =
    new Map();


  data.forEach(
    (row, index) => {


      let orderId =
        String(
          getValueByTest(
            row,
            isOrderIdColumn
          )
        )
        .trim();


      if (
        !orderId ||
        orderId === "-"
      ) {

        orderId =
          "__single__" +
          index;

      }


      if (
        !groups.has(
          orderId
        )
      ) {

        groups.set(
          orderId,
          []
        );

      }


      groups
        .get(orderId)
        .push(row);

    }
  );


  return groups;

}


/* =========================
   SUMMARY
========================= */

function updateSummary(data) {

  const groups =
    groupOrders(data);


  document
    .getElementById(
      "resultSummary"
    )
    .textContent =
    groups.size +
    (
      groups.size === 1
        ? " order"
        : " orders"
    ) +
    " · " +
    data.length +
    (
      data.length === 1
        ? " item"
        : " items"
    );

}


/* =========================
   DETAIL ROW
========================= */

function createDetailRow(
  label,
  value,
  isStatus = false
) {

  const displayValue =
    isStatus
      ? getStatusHTML(value)
      : escapeHTML(value);


  return `
    <div class="detail-row">

      <div class="detail-label">
        ${escapeHTML(label)}
      </div>

      <div class="detail-value">
        ${displayValue}
      </div>

    </div>
  `;

}


/* =========================
   MAIN DETAIL ROWS
========================= */

function buildMainDetails(row) {

  let html = "";


  html +=
    createDetailRow(
      "PAYMENT",
      getValueByTest(
        row,
        isPaymentColumn
      )
    );


  html +=
    createDetailRow(
      "SHIPPING TO ES",
      getValueByTest(
        row,
        isShippingColumn
      )
    );


  html +=
    createDetailRow(
      "STATUS",
      getValueByTest(
        row,
        isStatusColumn
      ),
      true
    );


  html +=
    createDetailRow(
      "MONTH",
      getValueByTest(
        row,
        isMonthColumn
      )
    );


  return html;

}


/* =========================
   EXTRA DETAIL ROWS
========================= */

function buildExtraDetails(row) {

  let html = "";


  html +=
    createDetailRow(
      "PURCHASE DATE",
      getValueByTest(
        row,
        isPurchaseDateColumn
      )
    );


  html +=
    createDetailRow(
      "WAREHOUSE",
      getValueByTest(
        row,
        isWarehouseColumn
      )
    );


  html +=
    createDetailRow(
      "ARRIVAL WH",
      getValueByTest(
        row,
        isArrivalColumn
      )
    );


  html +=
    createDetailRow(
      "DEPARTURE ES",
      getValueByTest(
        row,
        isDepartureColumn
      )
    );


  html +=
    createDetailRow(
      "DELIVERED DATE",
      getValueByTest(
        row,
        isDeliveredDateColumn
      )
    );


  return html;

}


/* =========================
   SINGLE ORDER
========================= */

function renderSingleOrder(
  row,
  index
) {

  const product =
    getValueByTest(
      row,
      isProductColumn
    );


  const item =
    getItemValue(
      row
    );


  const extraId =
    "single-extra-" +
    index;


  return `
    <div class="single-order">

      <div class="single-product">
        ${escapeHTML(product)}
      </div>

      <div class="single-item-count">
        1 ITEM
      </div>

      <div class="single-item-name">
        • ${escapeHTML(item)}
      </div>

      <div class="single-main">

        ${buildMainDetails(row)}

      </div>

      <div
        class="single-extra"
        id="${extraId}"
      >

        ${buildExtraDetails(row)}

      </div>

      <button
        type="button"
        class="single-more"
        data-target="${extraId}"
      >
        Show more ▼
      </button>

    </div>
  `;

}


/* =========================
   GROUPED ORDER
========================= */

function renderGroupedOrder(
  orderId,
  items,
  groupIndex
) {

  let html = `
    <div class="order-group">

      <div class="order-number">
        ORDER # ${escapeHTML(orderId)}
      </div>

      <div class="order-list-title">
        ORDER LIST
      </div>
  `;


  items.forEach(
    (row, itemIndex) => {


      const product =
        getValueByTest(
          row,
          isProductColumn
        );


      const item =
        getItemValue(
          row
        );


      const detailsId =
        "details-" +
        groupIndex +
        "-" +
        itemIndex;


      let title =
        "";


      if (
        product !== "-" &&
        item !== "-"
      ) {

        title =
          product +
          " - " +
          item;

      }

      else if (
        product !== "-"
      ) {

        title =
          product;

      }

      else {

        title =
          item;

      }


      html += `
        <div class="order-item">

          <button
            type="button"
            class="item-toggle"
            data-target="${detailsId}"
          >

            <span class="item-name">
              ${escapeHTML(title)}
            </span>

            <span class="item-arrow">
              ▼
            </span>

          </button>


          <div
            class="item-details"
            id="${detailsId}"
          >

            ${buildMainDetails(row)}

            ${buildExtraDetails(row)}

          </div>

        </div>
      `;

    }
  );


  html += `
    </div>
  `;


  return html;

}


/* =========================
   RENDER
========================= */

function renderOrders(data) {

  const results =
    document
      .getElementById(
        "results"
      );


  if (
    !data ||
    data.length === 0
  ) {

    results.innerHTML =
      "<div class='card'>No orders found for this status</div>";


    document
      .getElementById(
        "resultSummary"
      )
      .innerHTML =
      "";


    return;

  }


  updateSummary(data);


  const keys =
    Object.keys(
      data[0]
    );


  const itemKey =
    getItemKey(
      data[0]
    );


  /* =========================
     DESKTOP
  ========================= */

  const desktopKeys =
    keys.filter(
      key => {

        if (
          isIdColumn(key)
        ) {
          return false;
        }

        if (
          isUserIdColumn(key)
        ) {
          return false;
        }

        return true;

      }
    );


  let desktop =
    "<div class='desktop-view'>";


  desktop +=
    "<table><thead><tr>";


  desktopKeys.forEach(
    key => {


      let label =
        key;


      if (
        key === itemKey
      ) {

        label =
          "ITEM";

      }


      if (
        isOrderIdColumn(key)
      ) {

        label =
          "ORDER ID";

      }


      desktop += `
        <th>
          ${escapeHTML(label)}
        </th>
      `;

    }
  );


  desktop +=
    "</tr></thead><tbody>";


  data.forEach(
    row => {


      desktop +=
        "<tr>";


      desktopKeys.forEach(
        key => {


          let value =
            row[key] ??
            "-";


          if (
            isStatusColumn(key)
          ) {

            value =
              getStatusHTML(
                value
              );

          }

          else {

            value =
              escapeHTML(
                value
              );

          }


          desktop += `
            <td>
              ${value}
            </td>
          `;

        }
      );


      desktop +=
        "</tr>";

    }
  );


  desktop +=
    "</tbody></table></div>";


  /* =========================
     MOBILE HYBRID
  ========================= */

  const groups =
    groupOrders(data);


  let mobile =
    "<div class='mobile-view'>";


  let groupIndex =
    0;


  groups.forEach(
    (items, orderId) => {


      /*
       * MULTIPLE ITEMS WITH
       * SAME ORDER ID
       */

      if (
        items.length >= 2 &&
        !orderId.startsWith(
          "__single__"
        )
      ) {

        mobile +=
          renderGroupedOrder(
            orderId,
            items,
            groupIndex
          );

      }

      /*
       * ONLY ONE ITEM
       */

      else {

        mobile +=
          renderSingleOrder(
            items[0],
            groupIndex
          );

      }


      groupIndex++;

    }
  );


  mobile +=
    "</div>";


  results.innerHTML =
    desktop +
    mobile;


  activateToggles();

}


/* =========================
   TOGGLES
========================= */

function activateToggles() {


  document
    .querySelectorAll(
      ".item-toggle"
    )
    .forEach(
      button => {


        button.addEventListener(
          "click",
          function() {


            const target =
              document
                .getElementById(
                  this.dataset.target
                );


            if (!target) {
              return;
            }


            const open =
              target
                .classList
                .contains(
                  "open"
                );


            const arrow =
              this
                .querySelector(
                  ".item-arrow"
                );


            if (open) {

              target
                .classList
                .remove("open");


              arrow.textContent =
                "▼";

            }

            else {

              target
                .classList
                .add("open");


              arrow.textContent =
                "▲";

            }

          }
        );

      }
    );


  document
    .querySelectorAll(
      ".single-more"
    )
    .forEach(
      button => {


        button.addEventListener(
          "click",
          function() {


            const target =
              document
                .getElementById(
                  this.dataset.target
                );


            if (!target) {
              return;
            }


            const open =
              target
                .classList
                .contains(
                  "open"
                );


            if (open) {

              target
                .classList
                .remove("open");


              this.textContent =
                "Show more ▼";

            }

            else {

              target
                .classList
                .add("open");


              this.textContent =
                "Show less ▲";

            }

          }
        );

      }
    );

}
