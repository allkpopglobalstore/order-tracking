<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* =========================
   GENERAL
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

.container {
  width: 96%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
}


/* =========================
   SEARCH AREA
========================= */

.top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 700px;
  margin: 0 auto 20px auto;
}

.top input,
.top select {
  width: 100%;
  min-width: 0;
}

.top button {
  grid-column: 1 / -1;
  width: 100%;
}

input,
select {
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
  font-size: 14px;
}

button {
  padding: 13px 16px;
  background: black;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}


/* =========================
   CARDS / MESSAGES
========================= */

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.loading {
  text-align: center;
  padding: 20px;
  color: #666;
}

.error {
  background: #ffe6e6;
  color: #b30000;
  padding: 10px;
  border-radius: 8px;
}


/* =========================
   DESKTOP TABLE
========================= */

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  table-layout: auto;
}

th,
td {
  padding: 12px 10px;
  border-bottom: 1px solid #eee;
  text-align: left;
  font-size: 14px;
  vertical-align: middle;
}

th {
  background: #111;
  color: white;
  white-space: nowrap;
}


/* =========================
   STATUS
========================= */

.status {
  padding: 5px 10px;
  border-radius: 20px;
  color: white;
  font-size: 12px;
  display: inline-flex;
  white-space: nowrap;
  word-break: keep-all;
  overflow-wrap: normal;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  body {
    width: 100%;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 100%;
    padding: 7px;
  }

  /* SEARCH */

  .top {
    width: 100%;
    max-width: 100%;
    gap: 6px;
    margin-bottom: 12px;
  }

  .top input,
  .top select {
    padding: 9px 7px;
    font-size: 12px;
  }

  .top button {
    padding: 10px;
    font-size: 13px;
  }


  /* TABLE */

  table {
    width: 100%;
    max-width: 100%;
    table-layout: fixed;
  }

  th,
  td {
    padding: 4px 2px;
    font-size: 7px;
    line-height: 1.15;
    vertical-align: middle;

    /* permite comprimir la tabla */
    white-space: normal;
    overflow-wrap: break-word;
    word-break: normal;
  }

  th {
    font-size: 6.5px;
    line-height: 1.1;
    text-align: center;
  }


  /* =========================
     OCULTAR SOLO:
     ID + USER ID
  ========================= */

  .col-id,
  .col-user-id {
    display: none !important;
  }


  /* =========================
     AJUSTE DE COLUMNAS
  ========================= */

  .col-producto {
    width: 15%;
  }

  .col-item {
    width: 20%;
  }

  .col-pob {
    width: 5%;
    text-align: center;
  }

  .col-source {
    width: 7%;
  }

  .col-payment {
    width: 7%;
    text-align: center;
  }

  .col-shipping {
    width: 8%;
    text-align: center;
  }

  .col-status {
    width: 15%;
    text-align: center;
  }

  .col-purchase-date {
    width: 9%;
  }

  .col-warehouse {
    width: 7%;
    text-align: center;
  }

  .col-departure {
    width: 10%;
  }

  .col-arrival {
    width: 8%;
  }

  .col-month {
    width: 6%;
    text-align: center;
  }


  /* STATUS MÁS PEQUEÑO EN MÓVIL */

  .status {
    max-width: 100%;
    padding: 3px 4px;
    font-size: 6.5px;
    line-height: 1;
    white-space: normal;
    text-align: center;
    justify-content: center;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="top">

    <input
      id="userid"
      placeholder="User ID"
    >

    <select id="month">
      <option value="">All Months</option>
      <option>MAY</option>
      <option>JUNE</option>
      <option>JULY</option>
      <option>AUGUST</option>
    </select>

    <button onclick="search()">
      Search
    </button>

  </div>

  <div id="results"></div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbz80y4d-Ot7gRRKQBr0HZ_iO4stEpMIAMC6NjPy5dOiwXRzHkPkzKsmFq97cPWcf9i_/exec";


/* =========================
   COLUMN CLASS
========================= */

function getColumnClass(key) {

  const k = (key || "")
    .toString()
    .trim()
    .toLowerCase()
    .replace(/[👤📍📅🏢✈️📦]/g, "")
    .trim();

  if (k === "id") {
    return "col-id";
  }

  if (
    k === "user id" ||
    k === "userid"
  ) {
    return "col-user-id";
  }

  if (k === "producto") {
    return "col-producto";
  }

  /*
    En tu tabla hay una columna de descripción/item
    cuyo encabezado puede variar.
  */
  if (
    k === "" ||
    k.includes("item") ||
    k.includes("product name") ||
    k.includes("description")
  ) {
    return "col-item";
  }

  if (k === "pob") {
    return "col-pob";
  }

  if (k === "#") {
    return "col-source";
  }

  if (k.includes("payment")) {
    return "col-payment";
  }

  if (
    k.includes("shipping to es") ||
    k.includes("shipping")
  ) {
    return "col-shipping";
  }

  if (k.includes("status")) {
    return "col-status";
  }

  if (
    k.includes("purchase date") ||
    k.includes("purchase")
  ) {
    return "col-purchase-date";
  }

  if (k.includes("warehouse")) {
    return "col-warehouse";
  }

  if (k.includes("departure")) {
    return "col-departure";
  }

  if (k.includes("arrival")) {
    return "col-arrival";
  }

  if (
    k === "mes" ||
    k === "month"
  ) {
    return "col-month";
  }

  return "";
}


/* =========================
   STATUS COLOR
========================= */

function getStatusHTML(value) {

  const v = (value || "")
    .toString()
    .trim()
    .toUpperCase();

  let color = "#999";


  if (v === "DELIVERED") {
    color = "#2ecc71";
  }

  else if (v === "PURCHASED") {
    color = "#f1c40f";
  }

  else if (v === "IN WAREHOUSE KR") {
    color = "#9b59b6";
  }

  else if (v === "IN SPAIN") {
    color = "#3498db";
  }

  else if (v === "TO BUY") {
    color = "#e74c3c";
  }

  else if (v === "IN WAREHOUSE CH") {
    color = "#e67e22";
  }

  else if (v === "IN TRANSIT TO ES") {
    color = "#ff69b4";
  }


  return `
    <span
      class="status"
      style="background:${color};"
    >
      ${value}
    </span>
  `;
}


/* =========================
   SEARCH
========================= */

async function search() {

  const userId =
    document
      .getElementById("userid")
      .value
      .trim();

  const month =
    document
      .getElementById("month")
      .value;


  if (!userId) {

    document.getElementById("results").innerHTML =
      "<div class='error'>Enter User ID</div>";

    return;
  }


  document.getElementById("results").innerHTML =
    "<div class='loading'>Loading orders...</div>";


  try {

    const res = await fetch(
      API_URL +
      "?userId=" +
      encodeURIComponent(userId)
    );


    const data =
      await res.json();


    if (!Array.isArray(data)) {
      throw new Error("API error");
    }


    renderTable(
      data,
      month
    );

  }

  catch (err) {

    document.getElementById("results").innerHTML =
      "<div class='error'>Error loading data</div>";

    console.error(err);
  }
}


/* =========================
   RENDER TABLE
========================= */

function renderTable(data, month) {

  const results =
    document.getElementById("results");


  /* FILTER MONTH */

  if (month) {

    data = data.filter(row => {

      const rowMonth =
        (
          row["MES"] ||
          row["Month"] ||
          ""
        )
        .toString()
        .trim()
        .toUpperCase();

      return rowMonth === month;

    });

  }


  /* NO RESULTS */

  if (
    !data ||
    data.length === 0
  ) {

    results.innerHTML =
      "<div class='card'>No orders found</div>";

    return;
  }


  const keys =
    Object.keys(data[0]);


  /* TABLE START */

  let html =
    "<table><thead><tr>";


  /* HEADERS */

  keys.forEach(key => {

    const columnClass =
      getColumnClass(key);

    html += `
      <th class="${columnClass}">
        ${key}
      </th>
    `;

  });


  html +=
    "</tr></thead><tbody>";


  /* ROWS */

  data.forEach(row => {

    html += "<tr>";


    keys.forEach(key => {

      const columnClass =
        getColumnClass(key);

      let value =
        row[key] ?? "-";


      if (
        key
          .toLowerCase()
          .includes("status")
      ) {

        value =
          getStatusHTML(value);

      }


      html += `
        <td class="${columnClass}">
          ${value}
        </td>
      `;

    });


    html += "</tr>";

  });


  html +=
    "</tbody></table>";


  results.innerHTML =
    html;

}


/* =========================
   ENTER = SEARCH
========================= */

document
  .getElementById("userid")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        search();
      }

    }
  );

</script>

</body>
</html>
