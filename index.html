<!DOCTYPE html>
<html>

<head>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

.container {
  width: 96%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
}


/* =========================
   SEARCH
========================= */

.top {
  width: 100%;
  max-width: 700px;
  margin: 0 auto 10px auto;

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.field-group {
  min-width: 0;
}

.search-label {
  display: block;

  margin:
    0 0 6px 2px;

  font-size: 12px;
  font-weight: 600;

  color: #555;
}

.top input,
.top select {

  width: 100%;
  min-width: 0;

  padding: 14px;

  border:
    1px solid #ccc;

  border-radius: 9px;

  background: white;

  font-size: 15px;

  outline: none;
}

.top input:focus,
.top select:focus {

  border-color: #777;
}

.top button {

  grid-column:
    1 / -1;

  width: 100%;

  padding:
    14px 16px;

  background: black;

  color: white;

  border: none;

  border-radius: 9px;

  cursor: pointer;

  font-size: 15px;

  font-weight: 600;
}


/* =========================
   INFO + LIKE
========================= */

.info-bar {

  width: 100%;
  max-width: 700px;

  margin:
    0 auto 18px auto;

  padding:
    9px 12px;

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 12px;

  background: white;

  border:
    1px solid #e6e6e6;

  border-radius: 8px;
}

.info-message {

  color: #666;

  font-size: 11px;

  line-height: 1.35;

  flex: 1;
}

.info-icon {

  margin-right: 4px;
}

.like-area {

  display: flex;

  align-items: center;

  justify-content:
    flex-end;

  gap: 6px;

  flex-shrink: 0;
}

.like-button {

  width: 30px;
  height: 30px;

  padding: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  border:
    1px solid #ddd;

  border-radius: 50%;

  background: white;

  color: #555;

  cursor: pointer;

  font-size: 16px;

  line-height: 1;

  transition: 0.2s;
}

.like-button:hover {

  background: #fff4f6;

  border-color: #ffc5d0;
}

.like-button.liked {

  background: #fff0f3;

  border-color: #ffc5d0;

  color: #e63961;
}

.like-button.busy {

  opacity: 0.6;

  pointer-events: none;
}

.like-count {

  color: #777;

  font-size: 10px;

  white-space: nowrap;
}


/* =========================
   RESULT SUMMARY
========================= */

.result-summary {

  max-width: 700px;

  margin:
    0 auto 16px auto;

  font-size: 12px;

  color: #666;

  text-align: center;
}


/* =========================
   MESSAGES
========================= */

.card {

  background: white;

  padding: 15px;

  border-radius: 10px;

  margin-bottom: 10px;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,0.05);
}

.loading {

  text-align: center;

  padding: 20px;

  color: #666;
}

.error {

  background: #ffe6e6;

  color: #b30000;

  padding: 12px;

  border-radius: 8px;
}


/* =========================
   STATUS
========================= */

.status {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  padding:
    5px 10px;

  border-radius: 20px;

  color: white;

  font-size: 12px;

  white-space: nowrap;
}


/* =========================
   DESKTOP
========================= */

.desktop-view {
  display: block;
}

.mobile-view {
  display: none;
}

table {

  width: 100%;

  border-collapse:
    collapse;

  background: white;

  border-radius: 10px;

  overflow: hidden;

  table-layout: auto;
}

th,
td {

  padding:
    12px 10px;

  border-bottom:
    1px solid #eee;

  text-align: left;

  font-size: 14px;

  vertical-align: middle;
}

th {

  background: #111;

  color: white;

  white-space: nowrap;
}


/* =========================
   MOBILE ORDER
========================= */

.mobile-order {

  background: white;

  border:
    1px solid #e7e7e7;

  border-radius: 12px;

  margin-bottom: 16px;

  overflow: hidden;
}

.mobile-row {

  display: grid;

  grid-template-columns:
    38% 62%;

  border-bottom:
    1px solid #eee;
}

.mobile-row:last-child {

  border-bottom: none;
}

.mobile-label {

  background: #f7f7f7;

  padding:
    11px 10px;

  font-size: 11px;

  font-weight: 600;

  color: #444;

  display: flex;

  align-items: center;
}

.mobile-value {

  padding:
    11px 10px;

  font-size: 12px;

  color: #222;

  min-width: 0;

  overflow-wrap: anywhere;
}

.mobile-product
.mobile-label {

  background: #f1f1f1;
}

.mobile-product
.mobile-value {

  font-weight: 600;

  font-size: 13px;
}

.mobile-value
.status {

  font-size: 10px;

  padding:
    4px 7px;
}


/* =========================
   SHOW MORE
========================= */

.mobile-extra {
  display: none;
}

.mobile-extra.open {
  display: block;
}

.show-more-button {

  width: 100%;

  padding: 11px;

  background: #fafafa;

  border: none;

  border-top:
    1px solid #eee;

  color: #333;

  font-size: 12px;

  cursor: pointer;

  text-align: center;
}


/* =========================
   MOBILE
========================= */

@media
(max-width: 768px) {

  body {

    overflow-x: hidden;
  }

  .container {

    width: 100%;

    max-width: 100%;

    padding: 12px;
  }

  .top {

    gap: 7px;

    margin-bottom: 9px;
  }

  .search-label {

    font-size: 10px;
  }

  .top input,
  .top select {

    padding:
      11px 9px;

    font-size: 12px;
  }

  .top button {

    padding: 12px;

    font-size: 14px;
  }

  .info-bar {

    padding:
      8px 9px;

    gap: 7px;

    margin-bottom: 14px;
  }

  .info-message {

    font-size: 9px;
  }

  .like-button {

    width: 28px;

    height: 28px;

    font-size: 15px;
  }

  .like-count {

    font-size: 9px;
  }

  .desktop-view {

    display: none;
  }

  .mobile-view {

    display: block;
  }

}

</style>

</head>


<body>

<div class="container">


  <div class="top">


    <div class="field-group">

      <label
        class="search-label"
        for="userid"
      >
        Instagram User ID
      </label>

      <input
        id="userid"
        type="text"
        placeholder="Instagram User ID"
        autocomplete="off"
      >

    </div>


    <div class="field-group">

      <label
        class="search-label"
        for="statusFilter"
      >
        Order Status
      </label>

      <select
        id="statusFilter"
      >

        <option value="">
          All Status
        </option>

        <option value="TO BUY">
          To Buy
        </option>

        <option value="PURCHASED">
          Purchased
        </option>

        <option value="IN WAREHOUSE CH">
          In Warehouse CH
        </option>

        <option value="IN WAREHOUSE KR">
          In Warehouse KR
        </option>

        <option value="IN TRANSIT TO ES">
          In Transit to ES
        </option>

        <option value="IN SPAIN">
          In Spain
        </option>

        <option value="DELIVERED">
          Delivered
        </option>

      </select>

    </div>


    <button
      id="searchButton"
      type="button"
    >
      🔎 Search
    </button>


  </div>


  <!-- INFO + LIKE -->

  <div class="info-bar">


    <div class="info-message">

      <span class="info-icon">
        ⓘ
      </span>

      Delivered orders remain visible for 30 days.

    </div>


    <div class="like-area">

      <button
        id="likeButton"
        class="like-button"
        type="button"
        aria-label="Like this page"
        title="Like this page"
      >
        ♡
      </button>

      <span
        id="likeCount"
        class="like-count"
      >
        Loading...
      </span>

    </div>


  </div>


  <div
    id="resultSummary"
    class="result-summary"
  ></div>


  <div id="results"></div>


</div>


<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbz80y4d-Ot7gRRKQBr0HZ_iO4stEpMIAMC6NjPy5dOiwXRzHkPkzKsmFq97cPWcf9i_/exec";


let allOrders = [];


/* =========================
   NORMALIZE
========================= */

function normalizeHeader(key) {

  return (key || "")
    .toString()
    .trim()
    .toLowerCase()
    .replace(
      /[👤📍📅🏢✈️📦🚩🗓️]/g,
      ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

}


function normalizeStatus(
  value
) {

  return (value || "")
    .toString()
    .replace(
      /\u00A0/g,
      " "
    )
    .replace(
      /\u200B/g,
      ""
    )
    .replace(
      /\u200C/g,
      ""
    )
    .replace(
      /\u200D/g,
      ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim()
    .toUpperCase();

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   COLUMN TYPES
========================= */

function isIdColumn(key) {

  return (
    normalizeHeader(key)
    === "id"
  );

}


function isUserIdColumn(key) {

  const k =
    normalizeHeader(key);

  return (
    k === "user id" ||
    k === "userid"
  );

}


function isProductColumn(key) {

  return (
    normalizeHeader(key)
    === "producto"
  );

}


function isItemColumn(key) {

  const k =
    normalizeHeader(key);

  return (

    k === "" ||

    k === "item" ||

    k.includes(
      "producto comprado"
    ) ||

    k.includes(
      "product name"
    ) ||

    k.includes(
      "description"
    )

  );

}


function isPaymentColumn(key) {

  return normalizeHeader(key)
    .includes("payment");

}


function isShippingColumn(key) {

  return normalizeHeader(key)
    .includes("shipping");

}


function isStatusColumn(key) {

  return normalizeHeader(key)
    .includes("status");

}


function isMonthColumn(key) {

  const k =
    normalizeHeader(key);

  return (
    k === "mes" ||
    k === "month"
  );

}


/* =========================
   LABELS
========================= */

function getDesktopLabel(key) {

  if (
    isItemColumn(key)
  ) {

    return "ITEM";

  }

  return key;

}


function getMobileLabel(key) {

  if (
    isProductColumn(key)
  ) {
    return "PRODUCT";
  }


  if (
    isItemColumn(key)
  ) {
    return "ITEM";
  }


  if (
    isPaymentColumn(key)
  ) {
    return "PAYMENT";
  }


  if (
    isShippingColumn(key)
  ) {
    return "SHIPPING TO ES";
  }


  if (
    isStatusColumn(key)
  ) {
    return "STATUS";
  }


  if (
    isMonthColumn(key)
  ) {
    return "MONTH";
  }


  const clean =
    normalizeHeader(key);


  if (
    clean === "pob"
  ) {
    return "POB";
  }


  if (
    clean === "#"
  ) {
    return "#";
  }


  if (
    clean.includes(
      "purchase"
    )
  ) {
    return "PURCHASE DATE";
  }


  if (
    clean.includes(
      "warehouse"
    )
  ) {
    return "WAREHOUSE";
  }


  if (
    clean.includes(
      "departure"
    )
  ) {
    return "DEPARTURE";
  }


  if (
    clean.includes(
      "arrival WH"
    )
  ) {
    return "ARRIVAL WH";
  }


  return key || "DETAIL";

}


/* =========================
   STATUS
========================= */

function getOrderStatus(row) {

  const statusKey =
    Object
      .keys(row)
      .find(
        key =>
          isStatusColumn(key)
      );


  if (!statusKey) {

    return "";

  }


  return normalizeStatus(
    row[statusKey]
  );

}


function getStatusHTML(
  value
) {

  const originalValue =
    value ?? "-";


  const v =
    normalizeStatus(
      originalValue
    );


  let color =
    "#999";


  if (
    v === "DELIVERED"
  ) {

    color =
      "#2ecc71";

  }

  else if (
    v === "PURCHASED"
  ) {

    color =
      "#f1c40f";

  }

  else if (
    v === "IN WAREHOUSE KR"
  ) {

    color =
      "#9b59b6";

  }

  else if (
    v === "IN SPAIN"
  ) {

    color =
      "#3498db";

  }

  else if (
    v === "TO BUY"
  ) {

    color =
      "#e74c3c";

  }

  else if (
    v === "IN WAREHOUSE CH"
  ) {

    color =
      "#e67e22";

  }

  else if (
    v === "IN TRANSIT TO ES"
  ) {

    color =
      "#ff69b4";

  }


  return `
    <span
      class="status"
      style="background:${color};"
    >
      ${escapeHTML(
        originalValue
      )}
    </span>
  `;

}


/* =========================
   LIKE STATE
========================= */

function hasLiked() {

  try {

    return (
      localStorage
        .getItem(
          "allkpopOrderTrackingLiked"
        )
      === "yes"
    );

  }

  catch (
    error
  ) {

    return false;

  }

}


function saveLikedState(
  liked
) {

  try {

    if (
      liked
    ) {

      localStorage
        .setItem(
          "allkpopOrderTrackingLiked",
          "yes"
        );

    }

    else {

      localStorage
        .removeItem(
          "allkpopOrderTrackingLiked"
        );

    }

  }

  catch (
    error
  ) {

    console.error(
      error
    );

  }

}


/* =========================
   UPDATE LIKE UI
========================= */

function updateLikeUI() {

  const button =
    document
      .getElementById(
        "likeButton"
      );


  if (
    hasLiked()
  ) {

    button.textContent =
      "♥";


    button.classList
      .add(
        "liked"
      );


    button.title =
      "Remove like";


    button.setAttribute(
      "aria-label",
      "Remove like"
    );

  }

  else {

    button.textContent =
      "♡";


    button.classList
      .remove(
        "liked"
      );


    button.title =
      "Like this page";


    button.setAttribute(
      "aria-label",
      "Like this page"
    );

  }

}


/* =========================
   LIKE COUNT
========================= */

function updateLikeCount(
  likes
) {

  const count =
    document
      .getElementById(
        "likeCount"
      );


  const safeLikes =
    Math.max(
      0,
      Number(likes) || 0
    );


  count.textContent =
    safeLikes +
    (
      safeLikes === 1
        ? " like"
        : " likes"
    );

}


/* =========================
   LOAD LIKES
========================= */

async function loadLikes() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=getLikes"
      );


    const data =
      await response
        .json();


    updateLikeCount(
      data.likes
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    document
      .getElementById(
        "likeCount"
      )
      .textContent =
      "";

  }

}


/* =========================
   TOGGLE LIKE
========================= */

async function toggleLike() {

  const button =
    document
      .getElementById(
        "likeButton"
      );


  if (
    button.classList
      .contains(
        "busy"
      )
  ) {

    return;

  }


  button.classList
    .add(
      "busy"
    );


  const currentlyLiked =
    hasLiked();


  const action =
    currentlyLiked
      ? "unlike"
      : "like";


  try {

    const response =
      await fetch(
        API_URL +
        "?action=" +
        action
      );


    const data =
      await response
        .json();


    /*
     * Save opposite state
     */

    saveLikedState(
      !currentlyLiked
    );


    updateLikeUI();


    updateLikeCount(
      data.likes
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );

  }

  finally {

    button.classList
      .remove(
        "busy"
      );

  }

}


/* =========================
   SEARCH
========================= */

async function search() {

  const results =
    document
      .getElementById(
        "results"
      );


  const summary =
    document
      .getElementById(
        "resultSummary"
      );


  const userId =
    document
      .getElementById(
        "userid"
      )
      .value
      .trim();


  if (
    !userId
  ) {

    results.innerHTML =
      "<div class='error'>Enter your Instagram User ID</div>";


    summary.innerHTML =
      "";


    return;

  }


  results.innerHTML =
    "<div class='loading'>Loading orders...</div>";


  summary.innerHTML =
    "";


  try {


    const url =
      API_URL +
      "?userId=" +
      encodeURIComponent(
        userId
      );


    const response =
      await fetch(url);


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP error"
      );

    }


    const data =
      await response
        .json();


    if (
      !Array.isArray(
        data
      )
    ) {

      throw new Error(
        "API error"
      );

    }


    /*
     * Apps Script removes
     * delivered orders only
     * after 30 days.
     */

    allOrders =
      data;


    applyStatusFilter();

  }

  catch (
    error
  ) {


    console.error(
      error
    );


    results.innerHTML =
      "<div class='error'>Error loading data</div>";


    summary.innerHTML =
      "";

  }

}


/* =========================
   FILTER
========================= */

function applyStatusFilter() {

  const selectedStatus =
    normalizeStatus(

      document
        .getElementById(
          "statusFilter"
        )
        .value

    );


  let filtered =
    [...allOrders];


  if (
    selectedStatus
  ) {


    filtered =
      allOrders
        .filter(
          order =>

            getOrderStatus(
              order
            )
            ===
            selectedStatus

        );

  }


  renderOrders(
    filtered
  );


  updateResultSummary(
    filtered.length,
    allOrders.length,
    selectedStatus
  );

}


/* =========================
   SUMMARY
========================= */

function updateResultSummary(
  visible,
  total,
  status
) {

  const summary =
    document
      .getElementById(
        "resultSummary"
      );


  if (
    total === 0
  ) {

    summary.innerHTML =
      "";

    return;

  }


  if (
    !status
  ) {

    summary.textContent =
      total +
      (
        total === 1
          ? " order"
          : " orders"
      );

  }

  else {

    summary.textContent =
      visible +
      " of " +
      total +
      " orders";

  }

}


/* =========================
   MOBILE ROW
========================= */

function createMobileRow(
  label,
  value,
  extraClass = ""
) {

  return `
    <div
      class="mobile-row ${extraClass}"
    >

      <div
        class="mobile-label"
      >
        ${escapeHTML(label)}
      </div>

      <div
        class="mobile-value"
      >
        ${value}
      </div>

    </div>
  `;

}


/* =========================
   RENDER
========================= */

function renderOrders(
  data
) {

  const results =
    document
      .getElementById(
        "results"
      );


  if (
    !data ||
    data.length === 0
  ) {

    results.innerHTML =
      "<div class='card'>No orders found for this status</div>";


    return;

  }


  const keys =
    Object.keys(
      data[0]
    );


  /* =========================
     DESKTOP
  ========================= */

  const desktopKeys =
    keys.filter(
      key => {

        if (
          isIdColumn(key)
        ) {
          return false;
        }


        if (
          isUserIdColumn(key)
        ) {
          return false;
        }


        return true;

      }
    );


  let desktop =
    "<div class='desktop-view'>";


  desktop +=
    "<table>";


  desktop +=
    "<thead><tr>";


  desktopKeys
    .forEach(
      key => {


        desktop += `
          <th>
            ${escapeHTML(
              getDesktopLabel(key)
            )}
          </th>
        `;

      }
    );


  desktop +=
    "</tr></thead>";


  desktop +=
    "<tbody>";


  data.forEach(
    row => {


      desktop +=
        "<tr>";


      desktopKeys
        .forEach(
          key => {


            let value =
              row[key] ??
              "-";


            if (
              isStatusColumn(
                key
              )
            ) {

              value =
                getStatusHTML(
                  value
                );

            }

            else {

              value =
                escapeHTML(
                  value
                );

            }


            desktop += `
              <td>
                ${value}
              </td>
            `;

          }
        );


      desktop +=
        "</tr>";

    }
  );


  desktop +=
    "</tbody></table>";


  desktop +=
    "</div>";


  /* =========================
     MOBILE
  ========================= */

  let mobile =
    "<div class='mobile-view'>";


  data.forEach(
    (
      row,
      orderIndex
    ) => {


      const mainKeys =
        keys.filter(
          key => {

            return (

              isProductColumn(
                key
              ) ||

              isItemColumn(
                key
              ) ||

              isPaymentColumn(
                key
              ) ||

              isShippingColumn(
                key
              ) ||

              isStatusColumn(
                key
              ) ||

              isMonthColumn(
                key
              )

            );

          }
        );


      const extraKeys =
        keys.filter(
          key => {


            if (
              isIdColumn(key)
            ) {
              return false;
            }


            if (
              isUserIdColumn(key)
            ) {
              return false;
            }


            if (
              mainKeys
                .includes(
                  key
                )
            ) {
              return false;
            }


            return true;

          }
        );


      mobile += `
        <div
          class="mobile-order"
        >
      `;


      mainKeys
        .forEach(
          key => {


            let value =
              row[key] ??
              "-";


            if (
              isStatusColumn(
                key
              )
            ) {

              value =
                getStatusHTML(
                  value
                );

            }

            else {

              value =
                escapeHTML(
                  value
                );

            }


            const rowClass =
              isProductColumn(
                key
              )
                ? "mobile-product"
                : "";


            mobile +=
              createMobileRow(
                getMobileLabel(
                  key
                ),
                value,
                rowClass
              );

          }
        );


      if (
        extraKeys.length >
        0
      ) {


        mobile += `
          <div
            class="mobile-extra"
            id="extra-${orderIndex}"
          >
        `;


        extraKeys
          .forEach(
            key => {


              let value =
                row[key] ??
                "-";


              value =
                escapeHTML(
                  value
                );


              mobile +=
                createMobileRow(
                  getMobileLabel(
                    key
                  ),
                  value
                );

            }
          );


        mobile +=
          "</div>";


        mobile += `
          <button
            type="button"
            class="show-more-button"
            data-target="extra-${orderIndex}"
          >
            Show more ▼
          </button>
        `;

      }


      mobile +=
        "</div>";

    }
  );


  mobile +=
    "</div>";


  results.innerHTML =
    desktop +
    mobile;


  activateShowMoreButtons();

}


/* =========================
   SHOW MORE
========================= */

function activateShowMoreButtons() {

  const buttons =
    document
      .querySelectorAll(
        ".show-more-button"
      );


  buttons
    .forEach(
      button => {


        button
          .addEventListener(
            "click",
            function() {


              const target =
                document
                  .getElementById(
                    this
                      .dataset
                      .target
                  );


              if (
                !target
              ) {
                return;
              }


              const isOpen =
                target
                  .classList
                  .contains(
                    "open"
                  );


              if (
                isOpen
              ) {

                target
                  .classList
                  .remove(
                    "open"
                  );


                this
                  .textContent =
                  "Show more ▼";

              }

              else {

                target
                  .classList
                  .add(
                    "open"
                  );


                this
                  .textContent =
                  "Show less ▲";

              }

            }
          );

      }
    );

}


/* =========================
   EVENTS
========================= */

document
  .getElementById(
    "searchButton"
  )
  .addEventListener(
    "click",
    search
  );


document
  .getElementById(
    "statusFilter"
  )
  .addEventListener(
    "change",
    function() {

      if (
        allOrders.length >
        0
      ) {

        applyStatusFilter();

      }

    }
  );


document
  .getElementById(
    "userid"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event
          .preventDefault();

        search();

      }

    }
  );


document
  .getElementById(
    "likeButton"
  )
  .addEventListener(
    "click",
    toggleLike
  );


/* =========================
   PAGE LOAD
========================= */

loadLikes();

updateLikeUI();


</script>
