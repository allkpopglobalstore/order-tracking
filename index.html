<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* CONTENEDOR GENERAL */
.container {
  width: 96%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
  box-sizing: border-box;
}

/* BUSCADOR */
.top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 700px;
  margin: 0 auto 20px auto;
}

.top input,
.top select {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
}

.top button {
  grid-column: 1 / -1;
  width: 100%;
}

input,
select {
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-sizing: border-box;
}

button {
  padding: 13px 16px;
  background: black;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}

/* CARD fallback */
.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

/* TABLA */
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  table-layout: auto;
}

th,
td {
  padding: 12px 10px;
  border-bottom: 1px solid #eee;
  text-align: left;
  font-size: 14px;
  vertical-align: middle;

  /* permite que la tabla se adapte */
  white-space: normal;
}

th {
  background: #111;
  color: white;
  white-space: nowrap;
}

/* STATUS */
.status {
  padding: 5px 10px;
  border-radius: 20px;
  color: white;
  font-size: 12px;
  display: inline-flex;

  /* status siempre en una línea */
  white-space: nowrap;
  word-break: keep-all;
  overflow-wrap: normal;
}

/* LOADING */
.loading {
  text-align: center;
  padding: 20px;
  color: #666;
}

.error {
  background: #ffe6e6;
  color: #b30000;
  padding: 10px;
  border-radius: 8px;
}

/* MÓVIL */
@media (max-width: 768px) {

  .container {
    width: 100%;
    padding: 10px;
  }

  .top {
    gap: 7px;
    margin-bottom: 14px;
  }

  .top input,
  .top select {
    padding: 9px;
    font-size: 12px;
  }

  .top button {
    padding: 10px;
    font-size: 13px;
  }

  th,
  td {
    padding: 5px 4px;
    font-size: 9px;
  }

  th {
    white-space: normal;
  }

  .status {
    font-size: 8px;
    padding: 3px 5px;
  }
}

</style>
</head>

<body>

<div class="container">

  <div class="top">

    <input id="userid" placeholder="User ID">

    <select id="month">
      <option value="">All Months</option>
      <option>MAY</option>
      <option>JUNE</option>
      <option>JULY</option>
      <option>AUGUST</option>
    </select>

    <button onclick="search()">Search</button>

  </div>

  <div id="results"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbz80y4d-Ot7gRRKQBr0HZ_iO4stEpMIAMC6NjPy5dOiwXRzHkPkzKsmFq97cPWcf9i_/exec";

async function search() {

  const userId =
    document.getElementById("userid").value.trim();

  const month =
    document.getElementById("month").value;

  if (!userId) {
    document.getElementById("results").innerHTML =
      "<div class='error'>Enter User ID</div>";
    return;
  }

  document.getElementById("results").innerHTML =
    "<div class='loading'>Loading orders...</div>";

  try {

    const res = await fetch(
      API_URL +
      "?userId=" +
      encodeURIComponent(userId)
    );

    const data = await res.json();

    if (!Array.isArray(data)) {
      throw new Error("API error");
    }

    renderTable(data, month);

  } catch (err) {

    document.getElementById("results").innerHTML =
      "<div class='error'>Error loading data</div>";

    console.error(err);
  }
}


function getStatusHTML(value) {

  const v =
    (value || "")
      .toString()
      .trim()
      .toUpperCase();

  let color = "#999";

  if (v === "DELIVERED") {
    color = "#2ecc71";
  }
  else if (v === "PURCHASED") {
    color = "#f1c40f";
  }
  else if (v === "IN WAREHOUSE KR") {
    color = "#9b59b6";
  }
  else if (v === "IN SPAIN") {
    color = "#3498db";
  }
  else if (v === "TO BUY") {
    color = "#e74c3c";
  }
  else if (v === "IN WAREHOUSE CH") {
    color = "#e67e22";
  }
  else if (v === "IN TRANSIT TO ES") {
    color = "#ff69b4";
  }

  return `
    <span class="status" style="background:${color}">
      ${value}
    </span>
  `;
}


function renderTable(data, month) {

  if (month) {

    data = data.filter(row => {

      const rowMonth =
        (
          row["MES"] ||
          row["Month"] ||
          ""
        )
        .toString()
        .trim()
        .toUpperCase();

      return rowMonth === month;
    });
  }

  if (!data || data.length === 0) {

    document.getElementById("results").innerHTML =
      "<div class='card'>No orders found</div>";

    return;
  }

  const keys = Object.keys(data[0]);

  let html = "<table><tr>";

  keys.forEach(key => {
    html += "<th>" + key + "</th>";
  });

  html += "</tr>";


  data.forEach(row => {

    html += "<tr>";

    keys.forEach(key => {

      let value =
        row[key] ?? "-";

      if (
        key
          .toLowerCase()
          .includes("status")
      ) {

        value =
          getStatusHTML(value);
      }

      html +=
        "<td>" +
        value +
        "</td>";
    });

    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("results").innerHTML =
    html;
}

</script>

</body>
</html>
