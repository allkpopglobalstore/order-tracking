<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* =========================
   GENERAL
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

.container {
  width: 96%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
}


/* =========================
   SEARCH
========================= */

.top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 700px;
  margin: 0 auto 20px auto;
}

.top input,
.top select {
  width: 100%;
  min-width: 0;
}

.top button {
  grid-column: 1 / -1;
  width: 100%;
}

input,
select {
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
  font-size: 14px;
}

button {
  padding: 13px 16px;
  background: black;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}


/* =========================
   MESSAGES
========================= */

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.loading {
  text-align: center;
  padding: 20px;
  color: #666;
}

.error {
  background: #ffe6e6;
  color: #b30000;
  padding: 10px;
  border-radius: 8px;
}


/* =========================
   DESKTOP TABLE
========================= */

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  table-layout: auto;
}

th,
td {
  padding: 12px 10px;
  border-bottom: 1px solid #eee;
  text-align: left;
  font-size: 14px;
  vertical-align: middle;
}

th {
  background: #111;
  color: white;
  white-space: nowrap;
}


/* =========================
   STATUS
========================= */

.status {
  padding: 5px 10px;
  border-radius: 20px;
  color: white;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;

  white-space: nowrap;
  word-break: keep-all;
  overflow-wrap: normal;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  html,
  body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 6px;
    overflow: hidden;
  }


  /* SEARCH */

  .top {
    width: 100%;
    max-width: 100%;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 0 0 12px 0;
  }

  .top input,
  .top select {
    width: 100%;
    min-width: 0;
    padding: 9px 6px;
    font-size: 12px;
  }

  .top button {
    width: 100%;
    padding: 10px;
    font-size: 13px;
  }


  /* TABLE */

  table {
    width: 100% !important;
    max-width: 100% !important;
    table-layout: fixed;
    border-collapse: collapse;
  }

  th,
  td {
    padding: 4px 2px;
    font-size: 7px;
    line-height: 1.15;
    vertical-align: middle;

    white-space: normal;
    word-break: normal;
    overflow-wrap: anywhere;
    overflow: hidden;
  }

  th {
    font-size: 6.5px;
    line-height: 1.05;
    text-align: center;
  }


  /* =========================
     HIDE ONLY ID + USER ID
  ========================= */

  .col-id,
  .col-user-id {
    display: none !important;
  }


  /* =========================
     COLUMN WIDTHS
     TOTAL = 100%
  ========================= */

  .col-producto {
    width: 14%;
  }

  .col-item {
    width: 18%;
  }

  .col-pob {
    width: 4%;
    text-align: center;
  }

  .col-source {
    width: 4%;
    text-align: center;
  }

  .col-payment {
    width: 6%;
    text-align: center;
  }

  .col-shipping {
    width: 7%;
    text-align: center;
  }

  .col-status {
    width: 13%;
    text-align: center;
  }

  .col-purchase-date {
    width: 8%;
  }

  .col-warehouse {
    width: 6%;
    text-align: center;
  }

  .col-departure {
    width: 8%;
  }

  .col-arrival {
    width: 7%;
  }

  .col-month {
    width: 5%;
    text-align: center;
  }


  /* MOBILE STATUS */

  .status {
    display: inline-flex;
    max-width: 100%;
    padding: 3px 3px;

    font-size: 6px;
    line-height: 1.05;

    white-space: normal;
    word-break: normal;
    overflow-wrap: anywhere;

    align-items: center;
    justify-content: center;
    text-align: center;
  }

}


/* EXTRA SMALL PHONES */

@media (max-width: 420px) {

  .container {
    padding: 4px;
  }

  th,
  td {
    padding: 3px 1px;
    font-size: 6.5px;
  }

  th {
    font-size: 6px;
  }

  .status {
    font-size: 5.5px;
    padding: 2px;
  }

}

</style>
</head>


<body>

<div class="container">

  <div class="top">

    <input
      id="userid"
      type="text"
      placeholder="User ID"
    >

    <select id="month">

      <option value="">
        All Months
      </option>

      <option value="MAY">
        MAY
      </option>

      <option value="JUNE">
        JUNE
      </option>

      <option value="JULY">
        JULY
      </option>

      <option value="AUGUST">
        AUGUST
      </option>

    </select>

    <button onclick="search()">
      Search
    </button>

  </div>


  <div id="results"></div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbz80y4d-Ot7gRRKQBr0HZ_iO4stEpMIAMC6NjPy5dOiwXRzHkPkzKsmFq97cPWcf9i_/exec";


/* =========================
   NORMALIZE HEADER
========================= */

function normalizeHeader(key) {

  return (key || "")
    .toString()
    .trim()
    .toLowerCase()
    .replace(/[👤📍📅🏢✈️📦🚩]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}


/* =========================
   COLUMN CLASS
========================= */

function getColumnClass(key) {

  const k = normalizeHeader(key);


  /* ID */

  if (k === "id") {
    return "col-id";
  }


  /* USER ID */

  if (
    k === "user id" ||
    k === "userid"
  ) {
    return "col-user-id";
  }


  /* PRODUCTO */

  if (k === "producto") {
    return "col-producto";
  }


  /* ITEM / DESCRIPTION */

  if (
    k === "" ||
    k.includes("item") ||
    k.includes("description") ||
    k.includes("product name") ||
    k.includes("producto comprado")
  ) {
    return "col-item";
  }


  /* POB */

  if (k === "pob") {
    return "col-pob";
  }


  /* # */

  if (k === "#") {
    return "col-source";
  }


  /* PAYMENT */

  if (k.includes("payment")) {
    return "col-payment";
  }


  /* SHIPPING */

  if (k.includes("shipping")) {
    return "col-shipping";
  }


  /* STATUS */

  if (k.includes("status")) {
    return "col-status";
  }


  /* PURCHASE DATE */

  if (
    k.includes("purchase date") ||
    k === "purchase"
  ) {
    return "col-purchase-date";
  }


  /* WAREHOUSE */

  if (k.includes("warehouse")) {
    return "col-warehouse";
  }


  /* DEPARTURE */

  if (k.includes("departure")) {
    return "col-departure";
  }


  /* ARRIVAL */

  if (k.includes("arrival")) {
    return "col-arrival";
  }


  /* MONTH */

  if (
    k === "mes" ||
    k === "month"
  ) {
    return "col-month";
  }


  /*
    Cualquier columna que no reconozcamos
    usa col-item para que también tenga
    un ancho controlado en móvil.
  */

  return "col-item";
}


/* =========================
   STATUS COLOR
========================= */

function getStatusHTML(value) {

  const v = (value || "")
    .toString()
    .trim()
    .toUpperCase();


  let color = "#999";


  if (v === "DELIVERED") {

    color = "#2ecc71";

  }

  else if (v === "PURCHASED") {

    color = "#f1c40f";

  }

  else if (v === "IN WAREHOUSE KR") {

    color = "#9b59b6";

  }

  else if (v === "IN SPAIN") {

    color = "#3498db";

  }

  else if (v === "TO BUY") {

    color = "#e74c3c";

  }

  else if (v === "IN WAREHOUSE CH") {

    color = "#e67e22";

  }

  else if (v === "IN TRANSIT TO ES") {

    color = "#ff69b4";

  }


  return `
    <span
      class="status"
      style="background:${color};"
    >
      ${value}
    </span>
  `;
}


/* =========================
   SEARCH
========================= */

async function search() {

  const userId =
    document
      .getElementById("userid")
      .value
      .trim();


  const month =
    document
      .getElementById("month")
      .value;


  if (!userId) {

    document
      .getElementById("results")
      .innerHTML =
      "<div class='error'>Enter User ID</div>";

    return;
  }


  document
    .getElementById("results")
    .innerHTML =
    "<div class='loading'>Loading orders...</div>";


  try {

    const url =
      API_URL +
      "?userId=" +
      encodeURIComponent(userId);


    const res =
      await fetch(url);


    if (!res.ok) {
      throw new Error("HTTP error");
    }


    const data =
      await res.json();


    if (!Array.isArray(data)) {
      throw new Error("API error");
    }


    renderTable(
      data,
      month
    );

  }

  catch (err) {

    document
      .getElementById("results")
      .innerHTML =
      "<div class='error'>Error loading data</div>";


    console.error(err);

  }

}


/* =========================
   RENDER TABLE
========================= */

function renderTable(data, month) {

  const results =
    document.getElementById("results");


  /* MONTH FILTER */

  if (month) {

    data =
      data.filter(row => {

        const rowMonth =
          (
            row["MES"] ||
            row["Month"] ||
            ""
          )
          .toString()
          .trim()
          .toUpperCase();


        return rowMonth === month;

      });

  }


  /* NO RESULTS */

  if (
    !data ||
    data.length === 0
  ) {

    results.innerHTML =
      "<div class='card'>No orders found</div>";

    return;

  }


  const keys =
    Object.keys(data[0]);


  let html =
    "<table>";


  /* =========================
     TABLE HEADER
  ========================= */

  html +=
    "<thead><tr>";


  keys.forEach(key => {

    const columnClass =
      getColumnClass(key);


    html += `
      <th class="${columnClass}">
        ${key}
      </th>
    `;

  });


  html +=
    "</tr></thead>";


  /* =========================
     TABLE BODY
  ========================= */

  html +=
    "<tbody>";


  data.forEach(row => {

    html +=
      "<tr>";


    keys.forEach(key => {

      const columnClass =
        getColumnClass(key);


      let value =
        row[key];


      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        value = "-";

      }


      /* STATUS */

      if (
        normalizeHeader(key)
          .includes("status")
      ) {

        value =
          getStatusHTML(value);

      }


      html += `
        <td class="${columnClass}">
          ${value}
        </td>
      `;

    });


    html +=
      "</tr>";

  });


  html +=
    "</tbody>";


  html +=
    "</table>";


  results.innerHTML =
    html;

}


/* =========================
   ENTER = SEARCH
========================= */

document
  .getElementById("userid")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        search();

      }

    }
  );

</script>

</body>
</html>
